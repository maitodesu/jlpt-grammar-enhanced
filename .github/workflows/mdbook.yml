# Sample workflow for building and deploying a mdBook site to GitHub Pages
#
# To get started with mdBook see: https://rust-lang.github.io/mdBook/index.html
#
name: Deploy mdBook site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mdBook
        run: |
          curl --proto '=https' --tlsv1.2 https://sh.rustup.rs -sSf -y | sh
          rustup update
          cargo install mdbook
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Verify page structure
        run: python scripts/check_pages.py
      - name: Build with mdBook
        # mdbook exits 0 even when it warns (e.g. an unclosed <details> tag),
        # so a warning must be turned into a failure explicitly.
        run: |
          mdbook build 2>build.log || exit 1
          cat build.log
          # "search index is very large" is a book-size notice, not a page
          # defect -- it fires on every build of a book this size.
          if grep '^ *WARN' build.log | grep -qv 'search index is very large'; then
            echo "::error::mdbook emitted warnings (see above)"
            exit 1
          fi
      - name: Verify rendered output
        # Catches defects only visible after rendering: bold that failed to
        # parse, furigana trapped in a code span, unconverted {f|...} groups.
        run: python scripts/check_rendered.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
