[book]
authors = ["JLPT Grammar Enhanced contributors"]
language = "ja"
src = "src"
title = "JLPT Grammar - Enhanced"

[output.html]
default-theme = "Navy"
additional-js = ["js/lunr.stemmer.support.js", "js/tinyseg.js", "js/lunr.jp.js", "js/lunr.multi.js", "js/load-lunr-plugin.js"]
additional-css = ["style/custom.css"]
no-section-label = true

[output.html.fold]
# 336 page entries in one flat list is unusable. Collapse to the teaching
# groups; a group opens when you click it, and the group containing the
# current page opens automatically.
enable = true
level = 1

[output.html.search]
limit-results = 30
use-boolean-and = true

[preprocessor.furigana]
command = "python3 scripts/preprocess-furigana.py"
renderers = ["html"]
